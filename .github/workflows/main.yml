name: Toggle Branch Lock (develop)

on:
  workflow_dispatch:
    inputs:
      lock:
        description: 'Lock or unlock the develop branch'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'

jobs:
  toggle-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Set up GitHub CLI
        uses: cli/cli-action@v2

      - name: Lock or Unlock develop branch
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          if [ "${{ github.event.inputs.lock }}" = "true" ]; then
            echo "🔒 Locking develop branch..."
            gh api --method PUT /repos/ka2-ya/jsonl-reader-writer/branches/develop/lock
            echo "✅ Branch locked."
          else
            echo "🔓 Unlocking develop branch..."
            gh api --method DELETE /repos/ka2-ya/jsonl-reader-writer/branches/develop/lock
            echo "✅ Branch unlocked."
          fi
